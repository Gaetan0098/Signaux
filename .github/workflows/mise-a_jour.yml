name: Mise à jour des cours

on:
  schedule:
    # Du lundi au vendredi à 22h30 UTC, après la clôture de Wall Street
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas lxml requests
      - run: python telecharger_sp500.py
      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/donnees_bourse.json
          git diff --staged --quiet || git commit -m "Cours du $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
