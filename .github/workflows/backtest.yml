name: Backtest

on:
  workflow_dispatch:
    inputs:
      periode:
        description: "Période à tester"
        type: choice
        options: [developpement, validation]
        default: developpement

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy lxml requests matplotlib
      - run: python backtest/backtest.py --periode ${{ inputs.periode }}
      - name: Enregistrer le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add backtest/*.html backtest/*.json
          git diff --staged --quiet || git commit -m "Backtest ${{ inputs.periode }} du $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
